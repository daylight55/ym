# Project Configuration for {{ .projectName }}
# Generated by yaml-generator

project:
  name: "{{ .projectName }}"
  type: "{{ .projectType }}"

# Enabled Features:
features:
  {{- range .features }}
  - {{ . }}
  {{- end }}

# Selected Module:
module: "{{ .selectedModule }}"

contact:
  email: "dev@example.com" # Placeholder, will be simple for now.
